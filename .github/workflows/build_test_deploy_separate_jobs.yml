name: Build Test
on:
  push:
    branches:
      - main
env:
  VITE_APP_API_AIC: ${{ vars.VITE_APP_API_AIC }}
  VITE_APP_HARVARD_API: ${{ vars.VITE_APP_HARVARD_API }}
  VITE_APP_HARVARD_API_KEY: ${{ secrets.VITE_APP_HARVARD_API_KEY }}
  VITE_APP_VAM_API: ${{ vars.VITE_APP_VAM_API }}
  VITE_APP_TRADE_FEED: wss://ws-feed.exchange.coinbase.com
  VITE_APP_TRADE_PRODUCT: BTC-USD
  VITE_APP_TRADE_HISTORY: https://api.exchange.coinbase.com

jobs:
  build_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          registry-url: 'https://npm.pkg.github.com'
      - name: Build
        id: build
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm ci
          npm run lint
          npm run lint:css
          npm run build
      - name: Test
        run: npm test
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: ./dist

  pages:
    needs: build_test
    runs-on: ubuntu-latest
    concurrency:
      group: github-pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: ./dist
      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  smoke:
    needs: pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          registry-url: 'https://npm.pkg.github.com'
      - name: Install
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm ci
      - name: Install browser
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Smoke the deployed site
        run: npx playwright test

  lighthouse:
    needs: build_test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - page: home
            url: http://localhost:4517/ChosenPicachu/
          - page: gallery
            url: http://localhost:4517/ChosenPicachu/gallery/?tab=vam
          - page: users
            url: http://localhost:4517/ChosenPicachu/users/
          - page: demos
            url: http://localhost:4517/ChosenPicachu/demos/
          - page: games
            url: http://localhost:4517/ChosenPicachu/games/
          - page: tables
            url: http://localhost:4517/ChosenPicachu/demos/?tab=tables
          - page: tables-vanilla
            url: http://localhost:4517/ChosenPicachu/demos/?tab=tables&world=vanilla
          - page: menu-tutorial
            url: http://localhost:4517/ChosenPicachu/demos/?tab=tables&tut=menu
          - page: resize-tutorial
            url: http://localhost:4517/ChosenPicachu/demos/?tab=tables&tut=resize
          - page: drag-sort
            url: http://localhost:4517/ChosenPicachu/demos/?tab=dragAndDrop
    name: lighthouse (${{ matrix.page }})
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          registry-url: 'https://npm.pkg.github.com'
      - name: Install
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm ci
      - name: Take the shipped bundle
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: ./dist
      - name: Lighthouse audit of ${{ matrix.page }}
        id: audit
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: ${{ matrix.url }}
          configPath: ./lighthouserc.json
          uploadArtifacts: false
      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-${{ matrix.page }}
          path: ${{ steps.audit.outputs.resultsPath }}
          include-hidden-files: true
          if-no-files-found: error
