name: Build Test
on:
  push:
    branches:
      - main
      # a dev pushes a card's sha to verify/<issue> before Accepted: the unit tests, the journeys and the review run;
      # Lighthouse, pages and smoke run from main only
      - 'verify/**'
    # a push of documents alone runs nothing: no build or page imports a Markdown file, and the next code push's run and
    # review cover them (Ryan, 2026-11-08: "the ci should probably not run on doc updates")
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:
    inputs:
      review_from:
        description: 'Review the changes since this commit, instead of since the last commit the reviewer answered'
        required: false
env:
  VITE_APP_API_AIC: ${{ vars.VITE_APP_API_AIC }}
  VITE_APP_HARVARD_API: ${{ vars.VITE_APP_HARVARD_API }}
  VITE_APP_HARVARD_API_KEY: ${{ secrets.VITE_APP_HARVARD_API_KEY }}
  VITE_APP_VAM_API: ${{ vars.VITE_APP_VAM_API }}
  VITE_APP_AIC_PICTURES: https://www.artic.edu/iiif/2
  VITE_APP_VAM_PICTURES: https://framemark.vam.ac.uk/collections
  VITE_APP_CLEVELAND_API: https://openaccess-api.clevelandart.org/api/artworks
  VITE_APP_USERS_API: /api/users
  VITE_APP_FEEDBACK_TOKEN: ${{ secrets.CHOSEN_PICACHU_FEEDBACK }}

jobs:
  build_test:
    runs-on: ubuntu-26.04
    outputs:
      budgeted: ${{ steps.budgeted.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24.22'
          cache: 'npm'
          registry-url: 'https://npm.pkg.github.com'
      - name: Build
        id: build
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_APP_TRADE_FEED: wss://ws-feed.exchange.coinbase.com
          VITE_APP_TRADE_PRODUCT: BTC-USD
          VITE_APP_TRADE_HISTORY: https://api.exchange.coinbase.com
        run: |
          npm ci
          npm run lint
          npm run lint:css
          npm run lint:style
          npm run build
      - name: Test
        run: npm test
      - name: Name the pages under a performance budget
        id: budgeted
        run: |
          matrix=$(node --import ./scripts/node/imports-like-vite.mjs scripts/lighthouse/audited.mjs)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
      - name: Upload
        uses: actions/upload-artifact@v6
        with:
          name: site
          path: ./build/client

  review:
    needs: build_test
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      REVIEW_MODEL: ${{ vars.REVIEW_MODEL || 'claude-fable-5-1' }}
      REVIEW_AFTER: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24.22'
          cache: 'npm'
          registry-url: 'https://npm.pkg.github.com'
      - name: Install
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm ci
      - name: Start where the last review left off
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REVIEW_WORKFLOW: build_test_deploy_separate_jobs.yml
          REVIEW_ASKED_FROM: ${{ inputs.review_from }}
          REVIEW_PUSHED_FROM: ${{ github.event.before }}
        run: |
          if [ "$GITHUB_REF" != refs/heads/main ] && [ -z "$REVIEW_ASKED_FROM" ]; then
            REVIEW_ASKED_FROM=$(git merge-base origin/main HEAD)
            export REVIEW_ASKED_FROM
          fi
          REVIEW_BEFORE=$(node scripts/review/since.mjs)
          echo "REVIEW_BEFORE=$REVIEW_BEFORE" >> "$GITHUB_ENV"
      - name: Claude Code reviews the change against the house rules
        run: |
          npx --yes @anthropic-ai/claude-code@2.1.319 --print "$(node scripts/review/ask.mjs)" \
            --model "$REVIEW_MODEL" \
            --output-format json \
            --allowedTools "Agent,Read,Grep,Glob,Skill,Bash(git diff:*),Bash(git log:*),Bash(git show:*)" \
            --max-turns 80 \
            --no-session-persistence > review.json
      - name: Report
        run: |
          REVIEW_SUBJECT="$(git log -1 --format=%s "$GITHUB_SHA")" \
            node scripts/review/report.mjs < review.json >> "$GITHUB_STEP_SUMMARY"
      - name: Leave the feedback on the commit
        if: always() && hashFiles('review-comment.md') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -F body=@review-comment.md

  pages:
    needs: journeys
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    concurrency:
      group: github-pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download the site
        uses: actions/download-artifact@v7
        with:
          name: site
          path: ./build/client
      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./build/client
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  journeys:
    needs: build_test
    runs-on: ubuntu-24.04
    # Playwright's image has the browsers and their system libraries in it, so no job installs from the runner's apt
    # mirror, which hung on one shard a run through 2026-10-07; its tag follows @playwright/test in package.json
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --user 1001
    name: journeys (${{ matrix.browser }} ${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - {browser: chromium, shard: 1/2}
          - {browser: chromium, shard: 2/2}
          - {browser: firefox, shard: 1/3}
          - {browser: firefox, shard: 2/3}
          - {browser: firefox, shard: 3/3}
          - {browser: webkit, shard: 1/4}
          - {browser: webkit, shard: 2/4}
          - {browser: webkit, shard: 3/4}
          - {browser: webkit, shard: 4/4}
    steps:
      - uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24.22'
          cache: 'npm'
          registry-url: 'https://npm.pkg.github.com'
      - name: Install
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm ci
      - name: Take the shipped bundle
        uses: actions/download-artifact@v7
        with:
          name: site
          path: ./build/client
      - name: Walk the journeys on the stub stage
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: journeys.json
        run: npx playwright test --project="${{ matrix.browser }}*" --shard=${{ matrix.shard }} --reporter=line,json
      - name: Read the journeys in the run
        if: always() && hashFiles('journeys.json') != ''
        run: node scripts/playwright/summary.mjs "journeys, ${{ matrix.browser }} ${{ matrix.shard }}" journeys.json >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the traces of the journeys that failed
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: journey-traces-${{ matrix.browser }}-${{ strategy.job-index }}
          path: test-results
          include-hidden-files: true
          if-no-files-found: error

  smoke:
    needs: pages
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24.22'
          cache: 'npm'
          registry-url: 'https://npm.pkg.github.com'
      - name: Install
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm ci
      - name: Smoke the deployed site
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: smoke.json
        run: npx playwright test --config=playwright.smoke.config.cjs --reporter=line,json
      - name: Read the smoke in the run
        if: always() && hashFiles('smoke.json') != ''
        run: node scripts/playwright/summary.mjs smoke smoke.json >> "$GITHUB_STEP_SUMMARY"

  lighthouse:
    needs: build_test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.build_test.outputs.budgeted) }}
    name: lighthouse (${{ matrix.page }})
    steps:
      - uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24.22'
          cache: 'npm'
          registry-url: 'https://npm.pkg.github.com'
      - name: Install
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm ci
      - name: Take the shipped bundle
        uses: actions/download-artifact@v7
        with:
          name: site
          path: ./build/client
      - name: Lighthouse audit of ${{ matrix.page }}
        id: audit
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: ${{ matrix.url }}
          configPath: ./lighthouserc.json
          uploadArtifacts: false
      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: lighthouse-${{ matrix.page }}
          path: ${{ steps.audit.outputs.resultsPath }}
          include-hidden-files: true
          if-no-files-found: error

  lighthouse_scores:
    needs: lighthouse
    if: always() && contains(fromJSON('["success", "failure"]'), needs.lighthouse.result)
    runs-on: ubuntu-26.04
    name: lighthouse scores
    steps:
      - uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24.22'
          cache: 'npm'
          registry-url: 'https://npm.pkg.github.com'
      - name: Install
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm ci
      - name: Take every page's reports
        uses: actions/download-artifact@v7
        with:
          pattern: lighthouse-*
          path: lighthouse-reports
      - name: Read the scores in the run
        run: node --import ./scripts/node/imports-like-vite.mjs scripts/lighthouse/summary.mjs lighthouse-reports >> "$GITHUB_STEP_SUMMARY"
