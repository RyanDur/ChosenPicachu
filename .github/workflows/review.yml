name: Review
# A dev's branch reaches main as a pull request merged by rebase, and Claude Code reviews the pull request against the
# house rubrics. Why: Ryan, 2026-11-08, "the devs are using branches and those branches can be merged into main via
# rebase, then they would have code reviews", and "so the branches become PR's".
on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    env:
      REVIEW_BEFORE: ${{ github.event.pull_request.base.sha }}
      REVIEW_AFTER: ${{ github.event.pull_request.head.sha }}
      REVIEW_PULL: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24.22'
          cache: 'npm'
          registry-url: 'https://npm.pkg.github.com'
      - name: Install
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm ci
      - name: Ask for the review
        run: |
          {
            echo 'REVIEW_ASK<<ASKED'
            node scripts/review/ask.mjs
            echo
            echo 'ASKED'
            echo "REVIEW_SCHEMA=$(node -e "process.stdout.write(JSON.stringify(require('./scripts/review/findings.schema.json')))")"
          } >> "$GITHUB_ENV"
      - name: Claude Code reviews the pull request against the house rules
        id: review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          use_sticky_comment: true
          prompt: ${{ env.REVIEW_ASK }}
          claude_args: |
            --model ${{ vars.REVIEW_MODEL || 'claude-fable-5-1' }}
            --max-turns 80
            --json-schema '${{ env.REVIEW_SCHEMA }}'
            --allowedTools "Agent,Read,Grep,Glob,Skill,Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),mcp__github_inline_comment__create_inline_comment"
      - name: A violation stops the merge
        env:
          REVIEW_SUBJECT: ${{ github.event.pull_request.title }}
          REVIEW_FINDINGS: ${{ steps.review.outputs.structured_output }}
        run: printf '%s' "$REVIEW_FINDINGS" | node scripts/review/report.mjs >> "$GITHUB_STEP_SUMMARY"
