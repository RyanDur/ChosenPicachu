name: Discuss
on:
  pull_request_review_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pull:
        description: 'The pull request the reply is on'
        required: true
      comment:
        description: 'The id of the reply to answer'
        required: true

jobs:
  answer:
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event.pull_request.state == 'open' && github.event.comment.in_reply_to_id
          && github.event.comment.user.type != 'Bot'
          && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    env:
      PULL: ${{ github.event.pull_request.number || inputs.pull }}
      REPLY: ${{ github.event.comment.id || inputs.comment }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Fetch the pull request's head, to read and never run
        run: git fetch --no-tags origin "+refs/pull/$PULL/head:refs/heads/pr-head"
      - name: Gather the thread, if a reviewer started it
        id: thread
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          first=$(gh api "repos/$GITHUB_REPOSITORY/pulls/comments/$REPLY" -q '.in_reply_to_id // .id')
          if [ "$(gh api "repos/$GITHUB_REPOSITORY/pulls/comments/$first" -q .user.type)" != Bot ]; then
            echo "Comment $first is a person's, so its thread is a conversation between people" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/pulls/$PULL/comments" \
            | jq --argjson first "$first" --argjson reply "$REPLY" \
              '[add[] | select((.id == $first or .in_reply_to_id == $first) and .id <= $reply)
                | select(.user.type == "Bot" or (.author_association | IN("OWNER", "MEMBER", "COLLABORATOR")))
                | {author: .user.login, file: .path, line, commit: .commit_id, body}]' > discussion.json
          echo "first=$first" >> "$GITHUB_OUTPUT"
          echo "author=$(jq -r '.[0].author' discussion.json)" >> "$GITHUB_OUTPUT"
          echo "found=true" >> "$GITHUB_OUTPUT"
      - name: Claude Code weighs the reply
        if: steps.thread.outputs.found
        id: answer
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            discussion.json holds one review thread on pull request #${{ env.PULL }}, oldest comment first. The first comment is a finding by ${{ steps.thread.outputs.author }}; the last is a reply to it.

            1. Read the code the finding is about at the pull request's head, the branch `pr-head`: `git show pr-head:<path>`, `git grep <pattern> pr-head`, and any commit the replies name (`git show <sha>`). The checkout is the default branch, so the files on disk are not the pull request's.
            2. If the finding cites a rule, read it in AGENTS.md or the rubric under its Reviewers section. If it cites none, as Copilot's do not, judge it by its own claim against the code.
            3. Answer the last reply. The verdict is "Agreed" if the reply names a fix and the code shows it, or its argument holds; otherwise "Not yet". The body says in a sentence or two what settled it, or what still needs doing and why, citing the code or the rule, written as scripts/review/plain.md asks.
            Change no file.
          claude_args: |
            --model ${{ vars.REVIEW_MODEL || 'claude-fable-5-1' }}
            --max-turns 40
            --allowedTools "Read,Grep,Glob,Bash(git show:*),Bash(git log:*),Bash(git diff:*),Bash(git grep:*)"
            --json-schema '{"type":"object","required":["verdict","body"],"additionalProperties":false,"properties":{"verdict":{"enum":["Agreed","Not yet"]},"body":{"type":"string","description":"What settled it, or what still needs doing and why, in a sentence or two"}}}'
      - name: Answer in the thread
        if: steps.thread.outputs.found
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANSWER: ${{ steps.answer.outputs.structured_output }}
          FIRST: ${{ steps.thread.outputs.first }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PULL/comments/$FIRST/replies" \
            -f body="$(jq -r '"\(.verdict). \(.body)"' <<< "$ANSWER")" > /dev/null
      - name: Resolve the thread when the reviewer agrees
        if: steps.thread.outputs.found && fromJSON(steps.answer.outputs.structured_output).verdict == 'Agreed'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FIRST: ${{ steps.thread.outputs.first }}
        run: |
          thread=$(scripts/review/threads.sh "$PULL" \
            | jq -r --argjson first "$FIRST" '.[] | select(.first.nodes[0].databaseId == $first) | .id')
          if [ -z "$thread" ]; then
            echo "::error::No review thread on #$PULL starts with comment $FIRST"
            exit 1
          fi
          gh api graphql -f id="$thread" -f query='mutation($id: ID!) { resolveReviewThread(input: {threadId: $id}) { thread { isResolved } } }' > /dev/null
