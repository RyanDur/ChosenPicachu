name: Checks
on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
concurrency:
  group: checks-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true
jobs:
  changes:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      site: ${{ steps.changes.outputs.site }}
    steps:
      - name: Decide whether the pull request changes the site
        id: changes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PULL: ${{ github.event.pull_request.number }}
        run: |
          site=true
          if [ -n "$PULL" ] && files=$(gh pr diff "$PULL" -R "$GITHUB_REPOSITORY" --name-only); then
            if [ -n "$files" ] && ! grep -qvE '^docs/|\.md$' <<< "$files"; then
              site=false
            fi
          fi
          echo "site=$site" >> "$GITHUB_OUTPUT"

  build_test:
    needs: changes
    if: needs.changes.outputs.site == 'true'
    runs-on: ubuntu-26.04
    env:
      VITE_APP_API_AIC: ${{ vars.VITE_APP_API_AIC }}
      VITE_APP_HARVARD_API: ${{ vars.VITE_APP_HARVARD_API }}
      VITE_APP_HARVARD_API_KEY: ${{ secrets.VITE_APP_HARVARD_API_KEY }}
      VITE_APP_VAM_API: ${{ vars.VITE_APP_VAM_API }}
      VITE_APP_AIC_PICTURES: https://www.artic.edu/iiif/2
      VITE_APP_VAM_PICTURES: https://framemark.vam.ac.uk/collections
      VITE_APP_CLEVELAND_API: https://openaccess-api.clevelandart.org/api/artworks
      VITE_APP_USERS_API: /api/users
      VITE_APP_FEEDBACK_TOKEN: ${{ secrets.CHOSEN_PICACHU_FEEDBACK }}
    outputs:
      budgeted: ${{ steps.budgeted.outputs.matrix }}
    steps:
      # the pull request's own head is built, never GitHub's temporary merge commit: the head stays on GitHub after the
      # merge, so the samples' links to it keep working, and the branch is up to date with main, so its tree is the
      # tree the rebase lands
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: 'npm'
          registry-url: 'https://npm.pkg.github.com'
      - name: Build
        id: build
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_APP_TRADE_FEED: wss://ws-feed.exchange.coinbase.com
          VITE_APP_TRADE_PRODUCT: BTC-USD
          VITE_APP_TRADE_HISTORY: https://api.exchange.coinbase.com
        run: |
          npm ci
          npm run build
      - name: Lint
        run: |
          npm run lint
          npm run lint:css
          npm run lint:style
      - name: Test
        run: npm test
      - name: Name the pages under a performance budget
        id: budgeted
        run: |
          matrix=$(node --import ./scripts/node/imports-like-vite.mjs scripts/lighthouse/audited.mjs)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
      - name: Upload
        uses: actions/upload-artifact@v6
        with:
          name: site
          path: ./build/client

  journeys:
    needs: build_test
    runs-on: ubuntu-24.04
    # Playwright's image has the browsers and their system libraries in it, so no job installs from the runner's apt
    # mirror, which hung on one shard a run through 2026-10-07; its tag follows @playwright/test in package.json
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --user 1001
    name: journeys (${{ matrix.browser }} ${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - {browser: chromium, shard: 1/2}
          - {browser: chromium, shard: 2/2}
          - {browser: firefox, shard: 1/3}
          - {browser: firefox, shard: 2/3}
          - {browser: firefox, shard: 3/3}
          - {browser: webkit, shard: 1/4}
          - {browser: webkit, shard: 2/4}
          - {browser: webkit, shard: 3/4}
          - {browser: webkit, shard: 4/4}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: 'npm'
          registry-url: 'https://npm.pkg.github.com'
      - name: Install
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm ci
      - name: Take the shipped bundle
        uses: actions/download-artifact@v7
        with:
          name: site
          path: ./build/client
      - name: Walk the journeys on the stub stage
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: journeys.json
        run: npx playwright test --project="${{ matrix.browser }}*" --shard=${{ matrix.shard }} --reporter=line,json
      - name: Read the journeys in the run
        if: always() && hashFiles('journeys.json') != ''
        run: node scripts/playwright/summary.mjs "journeys, ${{ matrix.browser }} ${{ matrix.shard }}" journeys.json >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the traces of the journeys that failed
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: journey-traces-${{ matrix.browser }}-${{ strategy.job-index }}
          path: test-results
          include-hidden-files: true
          if-no-files-found: error

  lighthouse:
    needs: build_test
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.build_test.outputs.budgeted) }}
    name: lighthouse (${{ matrix.page }})
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: 'npm'
          registry-url: 'https://npm.pkg.github.com'
      - name: Install
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm ci
      - name: Take the shipped bundle
        uses: actions/download-artifact@v7
        with:
          name: site
          path: ./build/client
      - name: Lighthouse audit of ${{ matrix.page }}
        id: audit
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: ${{ matrix.url }}
          configPath: ./lighthouserc.json
          uploadArtifacts: false
      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: lighthouse-${{ matrix.page }}
          path: ${{ steps.audit.outputs.resultsPath }}
          include-hidden-files: true
          if-no-files-found: error

  lighthouse_scores:
    needs: lighthouse
    if: always() && contains(fromJSON('["success", "failure"]'), needs.lighthouse.result)
    runs-on: ubuntu-26.04
    name: lighthouse scores
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: 'npm'
          registry-url: 'https://npm.pkg.github.com'
      - name: Install
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm ci
      - name: Take every page's reports
        uses: actions/download-artifact@v7
        with:
          pattern: lighthouse-*
          path: lighthouse-reports
      - name: Read the scores in the run
        run: node --import ./scripts/node/imports-like-vite.mjs scripts/lighthouse/summary.mjs lighthouse-reports >> "$GITHUB_STEP_SUMMARY"

  review:
    needs: [changes, build_test]
    if: >-
      !cancelled() && github.event_name == 'pull_request' && needs.changes.result == 'success'
      && contains(fromJSON('["success", "skipped"]'), needs.build_test.result)
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    env:
      REVIEW_BEFORE: ${{ github.event.pull_request.base.sha }}
      REVIEW_AFTER: ${{ github.event.pull_request.head.sha }}
      REVIEW_PULL: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: 'npm'
          registry-url: 'https://npm.pkg.github.com'
      - name: Install
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm ci
      - name: Gather the conversations earlier reviews started
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          scripts/review/threads.sh "$REVIEW_PULL" \
            | jq '[.[] | select(.first.nodes[0].author.__typename == "Bot")
                | {resolved: .isResolved, file: .path, line,
                   comments: [.latest.nodes[] | select((.author.__typename == "Bot" or (.authorAssociation | IN("OWNER", "MEMBER", "COLLABORATOR")))) | {author: .author.login, body}]}]' \
            > earlier-findings.json
      - name: Ask for the review
        run: |
          {
            echo 'REVIEW_ASK<<ASKED'
            node scripts/review/ask.mjs
            echo
            echo 'ASKED'
            echo "REVIEW_SCHEMA=$(node -e "process.stdout.write(JSON.stringify(require('./scripts/review/findings.schema.json')))")"
          } >> "$GITHUB_ENV"
      - name: Claude Code reviews the pull request against the house rules
        id: review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          use_sticky_comment: true
          prompt: ${{ env.REVIEW_ASK }}
          claude_args: |
            --model ${{ vars.REVIEW_MODEL || 'claude-fable-5-1' }}
            --max-turns 80
            --json-schema '${{ env.REVIEW_SCHEMA }}'
            --allowedTools "Agent,Read,Grep,Glob,Skill,Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),mcp__github_inline_comment__create_inline_comment"
      - name: A violation stops the merge
        env:
          REVIEW_SUBJECT: ${{ github.event.pull_request.title }}
          REVIEW_FINDINGS: ${{ steps.review.outputs.structured_output }}
        run: printf '%s' "$REVIEW_FINDINGS" | node scripts/review/report.mjs >> "$GITHUB_STEP_SUMMARY"

  ready:
    needs: [changes, build_test, journeys, lighthouse, lighthouse_scores, review]
    if: always()
    runs-on: ubuntu-26.04
    steps:
      - name: Every check passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          if grep -qE 'failure|cancelled' <<< "$RESULTS"; then
            exit 1
          fi
