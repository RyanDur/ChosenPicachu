name: Checks
# every check runs on the pull request, and main only deploys what passed here (deploy.yml); nothing is pushed to main
# directly. Why: Ryan, 2026-11-08, "build_test review lighthose and journeys happen on PR's, rebase onto main takes the
# built artifact from a passing PR and then deploys it to pages and then smoke tests. no pushes to main"
on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
# a new push to a pull request stops its older run
concurrency:
  group: checks-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true
env:
  VITE_APP_API_AIC: ${{ vars.VITE_APP_API_AIC }}
  VITE_APP_HARVARD_API: ${{ vars.VITE_APP_HARVARD_API }}
  VITE_APP_HARVARD_API_KEY: ${{ secrets.VITE_APP_HARVARD_API_KEY }}
  VITE_APP_VAM_API: ${{ vars.VITE_APP_VAM_API }}
  VITE_APP_AIC_PICTURES: https://www.artic.edu/iiif/2
  VITE_APP_VAM_PICTURES: https://framemark.vam.ac.uk/collections
  VITE_APP_CLEVELAND_API: https://openaccess-api.clevelandart.org/api/artworks
  VITE_APP_USERS_API: /api/users
  VITE_APP_FEEDBACK_TOKEN: ${{ secrets.CHOSEN_PICACHU_FEEDBACK }}

jobs:
  changes:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      site: ${{ steps.changes.outputs.site }}
    steps:
      - name: Decide whether the pull request changes the site
        id: changes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PULL: ${{ github.event.pull_request.number }}
        run: |
          # documents alone change nothing a page imports, so they get the review and no build; anything else, or a
          # failed lookup, gets every check
          site=true
          if [ -n "$PULL" ] && files=$(gh pr diff "$PULL" -R "$GITHUB_REPOSITORY" --name-only); then
            if [ -n "$files" ] && ! grep -qvE '^docs/|\.md$' <<< "$files"; then
              site=false
            fi
          fi
          echo "site=$site" >> "$GITHUB_OUTPUT"

  build_test:
    needs: changes
    if: needs.changes.outputs.site == 'true'
    runs-on: ubuntu-26.04
    outputs:
      budgeted: ${{ steps.budgeted.outputs.matrix }}
    steps:
      # the pull request's own head is built, never GitHub's temporary merge commit: the head stays on GitHub after the
      # merge, so the samples' links to it keep working, and the branch is up to date with main, so its tree is the
      # tree the rebase lands
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24.22.1'
          cache: 'npm'
          registry-url: 'https://npm.pkg.github.com'
      - name: Build
        id: build
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_APP_TRADE_FEED: wss://ws-feed.exchange.coinbase.com
          VITE_APP_TRADE_PRODUCT: BTC-USD
          VITE_APP_TRADE_HISTORY: https://api.exchange.coinbase.com
        run: |
          npm ci
          npm run build
      - name: Lint
        run: |
          npm run lint
          npm run lint:css
          npm run lint:style
      - name: Test
        run: npm test
      - name: Name the pages under a performance budget
        id: budgeted
        run: |
          matrix=$(node --import ./scripts/node/imports-like-vite.mjs scripts/lighthouse/audited.mjs)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
      - name: Upload
        uses: actions/upload-artifact@v6
        with:
          name: site
          path: ./build/client

  journeys:
    needs: build_test
    runs-on: ubuntu-24.04
    # Playwright's image has the browsers and their system libraries in it, so no job installs from the runner's apt
    # mirror, which hung on one shard a run through 2026-10-07; its tag follows @playwright/test in package.json
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --user 1001
    name: journeys (${{ matrix.browser }} ${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - {browser: chromium, shard: 1/2}
          - {browser: chromium, shard: 2/2}
          - {browser: firefox, shard: 1/3}
          - {browser: firefox, shard: 2/3}
          - {browser: firefox, shard: 3/3}
          - {browser: webkit, shard: 1/4}
          - {browser: webkit, shard: 2/4}
          - {browser: webkit, shard: 3/4}
          - {browser: webkit, shard: 4/4}
    steps:
      - uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24.22.1'
          cache: 'npm'
          registry-url: 'https://npm.pkg.github.com'
      - name: Install
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm ci
      - name: Take the shipped bundle
        uses: actions/download-artifact@v7
        with:
          name: site
          path: ./build/client
      - name: Walk the journeys on the stub stage
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: journeys.json
        run: npx playwright test --project="${{ matrix.browser }}*" --shard=${{ matrix.shard }} --reporter=line,json
      - name: Read the journeys in the run
        if: always() && hashFiles('journeys.json') != ''
        run: node scripts/playwright/summary.mjs "journeys, ${{ matrix.browser }} ${{ matrix.shard }}" journeys.json >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the traces of the journeys that failed
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: journey-traces-${{ matrix.browser }}-${{ strategy.job-index }}
          path: test-results
          include-hidden-files: true
          if-no-files-found: error

  lighthouse:
    needs: build_test
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.build_test.outputs.budgeted) }}
    name: lighthouse (${{ matrix.page }})
    steps:
      - uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24.22.1'
          cache: 'npm'
          registry-url: 'https://npm.pkg.github.com'
      - name: Install
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm ci
      - name: Take the shipped bundle
        uses: actions/download-artifact@v7
        with:
          name: site
          path: ./build/client
      - name: Lighthouse audit of ${{ matrix.page }}
        id: audit
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: ${{ matrix.url }}
          configPath: ./lighthouserc.json
          uploadArtifacts: false
      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: lighthouse-${{ matrix.page }}
          path: ${{ steps.audit.outputs.resultsPath }}
          include-hidden-files: true
          if-no-files-found: error

  lighthouse_scores:
    needs: lighthouse
    if: always() && contains(fromJSON('["success", "failure"]'), needs.lighthouse.result)
    runs-on: ubuntu-26.04
    name: lighthouse scores
    steps:
      - uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24.22.1'
          cache: 'npm'
          registry-url: 'https://npm.pkg.github.com'
      - name: Install
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm ci
      - name: Take every page's reports
        uses: actions/download-artifact@v7
        with:
          pattern: lighthouse-*
          path: lighthouse-reports
      - name: Read the scores in the run
        run: node --import ./scripts/node/imports-like-vite.mjs scripts/lighthouse/summary.mjs lighthouse-reports >> "$GITHUB_STEP_SUMMARY"

  # the one check a merge waits for besides the review: the matrix jobs' names change with their shards and pages, so
  # the ruleset names this job, which passes only when every check above passed or had nothing to check
  ready:
    needs: [changes, build_test, journeys, lighthouse, lighthouse_scores]
    if: always()
    runs-on: ubuntu-26.04
    steps:
      - name: Every check passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          if grep -qE 'failure|cancelled' <<< "$RESULTS"; then
            exit 1
          fi
