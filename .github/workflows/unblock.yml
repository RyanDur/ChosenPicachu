name: unblock

# A Done card's issue stays open, so GitHub never releases a blocked-by link by itself.
on:
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  release:
    if: github.event.pull_request.merged && startsWith(github.event.pull_request.head.ref, 'verify/')
    runs-on: ubuntu-latest
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      BRANCH: ${{ github.event.pull_request.head.ref }}
    steps:
      - name: Release the cards this card blocked
        run: |
          card=$(printf '%s' "$BRANCH" | sed -nE 's#^verify/([0-9]+)([-/].*)?$#\1#p')
          if [ -z "$card" ]; then echo "$BRANCH names no card"; exit 0; fi
          id=$(gh api "repos/$REPO/issues/$card" -q .id)
          blocked=$(gh api "repos/$REPO/issues/$card/dependencies/blocking" -q '.[].url')
          failed=0
          for url in $blocked; do
            if gh api -X DELETE "$url/dependencies/blocked_by/$id" > /dev/null; then
              echo "${url#https://api.github.com/repos/} no longer waits on #$card"
            else
              echo "::warning::${url#https://api.github.com/repos/} kept its link to #$card"
              failed=1
            fi
          done
          exit $failed
