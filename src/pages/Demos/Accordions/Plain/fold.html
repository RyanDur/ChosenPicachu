<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>A fold measured by plain script</title>
    <style>
        html {
            overflow-y: clip;
        }

        /* the cascade */
    </style>
</head>
<body>
<article class="inclusive-accordion reveal">
    <fieldset>
        <legend class="off-screen">folds</legend>
        <ul class="accordion trim">
            <li class="fold">
                <input id="measured-fold-0-checkbox" class="info-toggle off-screen" type="checkbox">
                <label id="measured-fold-0-checkbox-label" class="info-label opening-arrow inverse-filled prior-approached corner-after" for="measured-fold-0-checkbox">measured</label>
                <section class="info-measured" aria-labelledby="measured-fold-0-checkbox-label">
                    <p class="info-paragraph">This panel is as tall as its text and carries no number: the script sets one only while the panel slides, and takes it away when the slide ends. Narrow the window and the lines wrap and the panel still fits.</p>
                </section>
            </li>
        </ul>
    </fieldset>
</article>
<script type="module">
    /* the script */
</script>
</body>
</html>
