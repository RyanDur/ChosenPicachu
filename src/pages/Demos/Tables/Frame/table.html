<section aria-label="live aggregations" class="aggregations">
  <table class="fancy-table sortable">
    <thead class="header">
    <tr class="row">
      <th scope="col" class="cell window header-cell clipped">
        <div class="header-cell-content resizable">window
          <button type="button" class="resize-handle"
                  aria-label="resize window"></button>
        </div>
      </th>
      <th scope="col" class="cell trades header-cell clipped">
        <div class="header-cell-content rankable resizable">trades
          <button type="button" class="menu-toggle rounded-corners"
                  popovertarget="sort-trades" aria-label="sort trades"></button>
          <menu id="sort-trades" popover="auto"
                class="menu field rounded-corners lifted">
            <li class="entry">
              <button type="button" class="item sub-title"
                      popovertarget="sort-trades" popovertargetaction="hide">ascending</button>
            </li>
            <li class="entry">
              <button type="button" class="item sub-title"
                      popovertarget="sort-trades" popovertargetaction="hide">descending</button>
            </li>
            <li class="entry">
              <button type="button" class="item sub-title"
                      popovertarget="sort-trades" popovertargetaction="hide">as dealt</button>
            </li>
          </menu>
          <button type="button" class="resize-handle"
                  aria-label="resize trades"></button>
        </div>
      </th>
      <th scope="col" class="cell buys header-cell clipped">
        <div class="header-cell-content rankable resizable">buys
          <button type="button" class="menu-toggle rounded-corners"

                      popovertarget="sort-buys" popovertargetaction="hide">descending</button>
            </li>
            <li class="entry">
              <button type="button" class="item sub-title"
                      popovertarget="sort-buys" popovertargetaction="hide">as dealt</button>
            </li>
          </menu>
          <button type="button" class="resize-handle"
                  aria-label="resize buys"></button>
        </div>
      </th>
      <th scope="col" class="cell sells header-cell clipped">
        <div class="header-cell-content rankable resizable">sells
          <button type="button" class="menu-toggle rounded-corners"
                  popovertarget="sort-sells" aria-label="sort sells"></button>
          <menu id="sort-sells" popover="auto"
                class="menu field rounded-corners lifted">
            <li class="entry">
              <button type="button" class="item sub-title"

      <th scope="col" class="cell volume header-cell clipped">
        <div class="header-cell-content rankable resizable">volume
          <button type="button" class="menu-toggle rounded-corners"
                  popovertarget="sort-volume" aria-label="sort volume"></button>
          <menu id="sort-volume" popover="auto"

                  aria-label="resize volume"></button>
        </div>

      <th scope="col" class="cell vwap header-cell clipped">
        <div class="header-cell-content rankable resizable">vwap
          <button type="button" class="menu-toggle rounded-corners"

                  aria-label="resize change"></button>
        </div>

    <tr class="row">
      <th scope="row" class="cell ellipsis row-header">
        <div class="row-header-content">
          <button type="button" class="grip grabbable" aria-label="move row 1">

            <path d="M4 14.5h16"/>

            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16"
               fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true">
            <path d="M4 9.5h16"/>
            <path d="M4 14.5h16"/>
          </svg>

            <path d="M4 9.5h16"/>
            <path d="M4 14.5h16"/>
          </svg>
          </button>this hour
        </div>
      </th>
      <td class="cell ellipsis">0</td>
      <td class="cell ellipsis">0</td>
      <td class="cell ellipsis">0</td>
      <td class="cell ellipsis">0.00</td>
      <td class="cell ellipsis">—</td>
      <td class="cell ellipsis">—</td>
    </tr>
    <tr class="row">
      <th scope="row" class="cell ellipsis row-header">
        <div class="row-header-content">
