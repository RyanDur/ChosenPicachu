<section aria-label="live aggregations" class="aggregations">
  <table class="fancy-table sortable apportioned">
    <thead class="header">
    <tr class="row">
      <th scope="col" class="cell window header-cell" aria-label="window">window
        <button type="button" tabindex="0" class="resize-handle"
                aria-label="resize window"></button>
      </th>
      <th scope="col" class="cell trades header-cell" aria-label="trades">trades
        <button type="button" tabindex="0" class="menu-toggle rounded-corners"
                popovertarget="sort-trades" aria-label="sort trades"></button>
        <menu id="sort-trades" tabindex="-1" popover="auto" aria-label="sort trades by"
              class="menu field rounded-corners lifted">
          <li class="entry">
            <button type="button" tabindex="0" class="item sub-title"
                    popovertarget="sort-trades" popovertargetaction="hide">ascending</button>
          </li>
          <li class="entry">
            <button type="button" tabindex="0" class="item sub-title"
                    popovertarget="sort-trades" popovertargetaction="hide">descending</button>
          </li>
          <li class="entry">
            <button type="button" tabindex="0" class="item sub-title"
                    popovertarget="sort-trades" popovertargetaction="hide">reset</button>
          </li>
        </menu>
        <button type="button" tabindex="0" class="resize-handle"
                aria-label="resize trades"></button>
      </th>
      <th scope="col" class="cell buys header-cell" aria-label="buys">buys
        <button type="button" tabindex="0" class="menu-toggle rounded-corners"
                popovertarget="sort-buys" aria-label="sort buys"></button>
        <menu id="sort-buys" tabindex="-1" popover="auto" aria-label="sort buys by"
              class="menu field rounded-corners lifted">
          <li class="entry">
            <button type="button" tabindex="0" class="item sub-title"
                    popovertarget="sort-buys" popovertargetaction="hide">ascending</button>
          </li>
          <li class="entry">
            <button type="button" tabindex="0" class="item sub-title"
                    popovertarget="sort-buys" popovertargetaction="hide">descending</button>
          </li>
          <li class="entry">
            <button type="button" tabindex="0" class="item sub-title"
                    popovertarget="sort-buys" popovertargetaction="hide">reset</button>
          </li>
        </menu>
        <button type="button" tabindex="0" class="resize-handle"
                aria-label="resize buys"></button>
      </th>
      <th scope="col" class="cell sells header-cell" aria-label="sells">sells
        <button type="button" tabindex="0" class="menu-toggle rounded-corners"
                popovertarget="sort-sells" aria-label="sort sells"></button>
        <menu id="sort-sells" tabindex="-1" popover="auto" aria-label="sort sells by"
              class="menu field rounded-corners lifted">
          <li class="entry">
            <button type="button" tabindex="0" class="item sub-title"
                    popovertarget="sort-sells" popovertargetaction="hide">ascending</button>
          </li>
          <li class="entry">
            <button type="button" tabindex="0" class="item sub-title"
                    popovertarget="sort-sells" popovertargetaction="hide">descending</button>
          </li>
          <li class="entry">
            <button type="button" tabindex="0" class="item sub-title"
                    popovertarget="sort-sells" popovertargetaction="hide">reset</button>
          </li>
        </menu>
        <button type="button" tabindex="0" class="resize-handle"
                aria-label="resize sells"></button>
      </th>
      <th scope="col" class="cell volume header-cell" aria-label="volume">volume
        <button type="button" tabindex="0" class="menu-toggle rounded-corners"
                popovertarget="sort-volume" aria-label="sort volume"></button>
        <menu id="sort-volume" tabindex="-1" popover="auto" aria-label="sort volume by"
              class="menu field rounded-corners lifted">
          <li class="entry">
            <button type="button" tabindex="0" class="item sub-title"
                    popovertarget="sort-volume" popovertargetaction="hide">ascending</button>
          </li>
          <li class="entry">
            <button type="button" tabindex="0" class="item sub-title"
                    popovertarget="sort-volume" popovertargetaction="hide">descending</button>
          </li>
          <li class="entry">
            <button type="button" tabindex="0" class="item sub-title"
                    popovertarget="sort-volume" popovertargetaction="hide">reset</button>
          </li>
        </menu>
        <button type="button" tabindex="0" class="resize-handle"
                aria-label="resize volume"></button>
      </th>
      <th scope="col" class="cell vwap header-cell" aria-label="vwap">vwap
        <button type="button" tabindex="0" class="menu-toggle rounded-corners"
                popovertarget="sort-vwap" aria-label="sort vwap"></button>
        <menu id="sort-vwap" tabindex="-1" popover="auto" aria-label="sort vwap by"
              class="menu field rounded-corners lifted">
          <li class="entry">
            <button type="button" tabindex="0" class="item sub-title"
                    popovertarget="sort-vwap" popovertargetaction="hide">ascending</button>
          </li>
          <li class="entry">
            <button type="button" tabindex="0" class="item sub-title"
                    popovertarget="sort-vwap" popovertargetaction="hide">descending</button>
          </li>
          <li class="entry">
            <button type="button" tabindex="0" class="item sub-title"
                    popovertarget="sort-vwap" popovertargetaction="hide">reset</button>
          </li>
        </menu>
        <button type="button" tabindex="0" class="resize-handle"
                aria-label="resize vwap"></button>
      </th>
      <th scope="col" class="cell change header-cell" aria-label="change">change
        <button type="button" tabindex="0" class="menu-toggle rounded-corners"
                popovertarget="sort-change" aria-label="sort change"></button>
        <menu id="sort-change" tabindex="-1" popover="auto" aria-label="sort change by"
              class="menu field rounded-corners lifted">
          <li class="entry">
            <button type="button" tabindex="0" class="item sub-title"
                    popovertarget="sort-change" popovertargetaction="hide">ascending</button>
          </li>
          <li class="entry">
            <button type="button" tabindex="0" class="item sub-title"
                    popovertarget="sort-change" popovertargetaction="hide">descending</button>
          </li>
          <li class="entry">
            <button type="button" tabindex="0" class="item sub-title"
                    popovertarget="sort-change" popovertargetaction="hide">reset</button>
          </li>
        </menu>
        <button type="button" tabindex="0" class="resize-handle"
                aria-label="resize change"></button>
      </th>
    </tr>
    </thead>
    <tbody class="body">
    <tr class="row">
      <th scope="row" class="cell row-header">
        <button type="button" tabindex="0" class="grip grabbable" aria-label="move row 1">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16"
               fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true">
            <path d="M4 9.5h16"/>
            <path d="M4 14.5h16"/>
          </svg>
        </button>this minute
      </th>
      <td class="cell">0</td>
      <td class="cell">0</td>
      <td class="cell">0</td>
      <td class="cell">0.00</td>
      <td class="cell">—</td>
      <td class="cell">—</td>
    </tr>
    <tr class="row">
      <th scope="row" class="cell row-header">
        <button type="button" tabindex="0" class="grip grabbable" aria-label="move row 2">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16"
               fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true">
            <path d="M4 9.5h16"/>
            <path d="M4 14.5h16"/>
          </svg>
        </button>last 5 minutes
      </th>
      <td class="cell">0</td>
      <td class="cell">0</td>
      <td class="cell">0</td>
      <td class="cell">0.00</td>
      <td class="cell">—</td>
      <td class="cell">—</td>
    </tr>
    <tr class="row">
      <th scope="row" class="cell row-header">
        <button type="button" tabindex="0" class="grip grabbable" aria-label="move row 3">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16"
               fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true">
            <path d="M4 9.5h16"/>
            <path d="M4 14.5h16"/>
          </svg>
        </button>last 15 minutes
      </th>
      <td class="cell">0</td>
      <td class="cell">0</td>
      <td class="cell">0</td>
      <td class="cell">0.00</td>
      <td class="cell">—</td>
      <td class="cell">—</td>
    </tr>
    <tr class="row">
      <th scope="row" class="cell row-header">
        <button type="button" tabindex="0" class="grip grabbable" aria-label="move row 4">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16"
               fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true">
            <path d="M4 9.5h16"/>
            <path d="M4 14.5h16"/>
          </svg>
        </button>this hour
      </th>
      <td class="cell">0</td>
      <td class="cell">0</td>
      <td class="cell">0</td>
      <td class="cell">0.00</td>
      <td class="cell">—</td>
      <td class="cell">—</td>
    </tr>
    <tr class="row">
      <th scope="row" class="cell row-header">
        <button type="button" tabindex="0" class="grip grabbable" aria-label="move row 5">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16"
               fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true">
            <path d="M4 9.5h16"/>
            <path d="M4 14.5h16"/>
          </svg>
        </button>session
      </th>
      <td class="cell">0</td>
      <td class="cell">0</td>
      <td class="cell">0</td>
      <td class="cell">0.00</td>
      <td class="cell">—</td>
      <td class="cell">—</td>
    </tr>
    </tbody>
  </table>
  <output class="move-report off-screen"></output>
</section>
