<section aria-label="live aggregations" class="aggregations">
  <table class="fancy-table sortable">
    <thead class="header">
    <tr class="row">
      <th scope="col" class="cell window header-cell"><div class="header-cell-content">window</div></th>
      <th scope="col" class="cell trades header-cell"><div class="header-cell-content">trades</div></th>
      <th scope="col" class="cell buys header-cell"><div class="header-cell-content">buys</div></th>
      <th scope="col" class="cell sells header-cell"><div class="header-cell-content">sells</div></th>
      <th scope="col" class="cell volume header-cell"><div class="header-cell-content">volume</div></th>
      <th scope="col" class="cell vwap header-cell"><div class="header-cell-content">vwap</div></th>
      <th scope="col" class="cell change header-cell"><div class="header-cell-content">change</div></th>
    </tr>
    </thead>
    <tbody class="body">
    <tr class="row">
      <th scope="row" class="cell window row-header"><div class="row-header-content">this minute</div></th>
      <td class="cell trades">0</td>
      <td class="cell buys">0</td>
      <td class="cell sells">0</td>
      <td class="cell volume">0.00</td>
      <td class="cell vwap">—</td>
      <td class="cell change">—</td>
    </tr>
    <tr class="row">
      <th scope="row" class="cell window row-header"><div class="row-header-content">last 5 minutes</div></th>
      <td class="cell trades">0</td>
      <td class="cell buys">0</td>
      <td class="cell sells">0</td>
      <td class="cell volume">0.00</td>
      <td class="cell vwap">—</td>
      <td class="cell change">—</td>
    </tr>
    <tr class="row">
      <th scope="row" class="cell window row-header"><div class="row-header-content">last 15 minutes</div></th>
      <td class="cell trades">0</td>
      <td class="cell buys">0</td>
      <td class="cell sells">0</td>
      <td class="cell volume">0.00</td>
      <td class="cell vwap">—</td>
      <td class="cell change">—</td>
    </tr>
    <tr class="row">
      <th scope="row" class="cell window row-header"><div class="row-header-content">this hour</div></th>
      <td class="cell trades">0</td>
      <td class="cell buys">0</td>
      <td class="cell sells">0</td>
      <td class="cell volume">0.00</td>
      <td class="cell vwap">—</td>
      <td class="cell change">—</td>
    </tr>
    <tr class="row">
      <th scope="row" class="cell window row-header"><div class="row-header-content">session</div></th>
      <td class="cell trades">0</td>
      <td class="cell buys">0</td>
      <td class="cell sells">0</td>
      <td class="cell volume">0.00</td>
      <td class="cell vwap">—</td>
      <td class="cell change">—</td>
    </tr>
    </tbody>
  </table>
</section>
